name: deploy-pages

# Publishes the one-page site (docs/index.html) to GitHub Pages.
#
# Requires a one-time repository setting: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Without it, configure-pages fails with a 404 and there is
# nothing in the workflow to fix.
#
# docs/ also holds the architecture notes and ADRs as markdown, and serving those raw would
# put unrendered .md files on a public URL. So the job assembles a _site/ that contains only
# the page and its assets rather than uploading docs/ wholesale.
#
# Two departures from the shared pipeline this is copied from, both deliberate:
#   * Skipped while the repository is private. Pages for a private repository needs a paid
#     plan, so the job would fail on every push to docs/ until the repository is public.
#   * The asset copy tolerates an empty docs/assets/. This repository has no logo, and a
#     project's mark is a decision for a person rather than a default; the unmodified step
#     fails on a glob that matches nothing.

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deployment: a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    if: ${{ github.event.repository.private != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect the page and its assets
        run: |
          shopt -s nullglob
          mkdir -p _site/assets
          cp docs/index.html _site/
          for asset in docs/assets/*.svg; do cp "$asset" _site/assets/; done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
