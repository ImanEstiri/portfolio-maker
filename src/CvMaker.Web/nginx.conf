server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Dedicated health endpoint. The platform check must not point at index.html: nginx serves
    # the index happily when the WASM bundle behind it is broken, so that check would pass on
    # a white screen. This one means only "nginx is up", which is all a static host can
    # honestly claim.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Blazor WASM is a single-page app: every route must fall through to
    # index.html or a refresh on /generate returns 404.
    location / {
        include /etc/nginx/cvmaker-security-headers.conf;
        try_files $uri $uri/ /index.html =404;
    }

    # Fingerprinted framework assets are immutable; index.html must not be
    # cached or a deploy leaves clients on the previous build indefinitely.
    location /_framework/ {
        # nginx's add_header does not inherit into a context that declares its own, so every
        # location setting a cache header has to restate the security headers or silently
        # lose them. This is the whole reason they live in an included file.
        include /etc/nginx/cvmaker-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/cvmaker-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # appsettings.json carries the API base URL, so it is environment-specific
    # and must never be cached across a redeploy.
    location = /appsettings.json {
        include /etc/nginx/cvmaker-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;
}
